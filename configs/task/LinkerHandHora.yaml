# used to create the object
name: LinkerHandHora # modified
physics_engine: ${..physics_engine}
on_evaluation: False
eval_cache_name: debug

env:
  initPoseMode: 'high'
  numEnvs: ${resolve_default:4096,${...num_envs}}
  numObservations: 126 # 这个参数在vec_tast用到 21*2*3
  # ============================================================
  # numActions 说明：
  # 此值为基准动作维度，实际维度由以下配置组合决定：
  # ┌─────────────────────────────────────────────────────────────┐
  # │ 配置                           │ 实际动作维度                │
  # ├─────────────────────────────────────────────────────────────┤
  # │ Flying + 完整手指              │ 6 + 21 = 27 DoF            │
  # │ Flying + 禁用 ring/little      │ 6 + 13 = 19 DoF            │
  # │ 无 Flying + 完整手指           │ 21 DoF                     │
  # │ 无 Flying + 禁用 ring/little   │ 13 DoF                     │
  # └─────────────────────────────────────────────────────────────┘
  # ============================================================
  numActions: 21 # 默认关闭 Flying Hand，使用固定底座的 21 DoF
  envSpacing: 0.5
  
  # ============================================================
  # Flying Hand 配置 (6 DoF Floating Base)
  # ============================================================
  # 为转笔任务设计的浮空底座，允许手腕在空间中移动和旋转
  # 通过严格的速度和位置限制防止利用惯性"作弊"（甩手腕转笔）
  #
  # Flying Base 结构 (6 DoF):
  #   - virtual_px: 平移 X 轴 (±5cm)
  #   - virtual_py: 平移 Y 轴 (±5cm)
  #   - virtual_pz: 平移 Z 轴 (30cm~40cm)
  #   - virtual_rx: 旋转 Roll (±90°)
  #   - virtual_ry: 旋转 Pitch (±90°)
  #   - virtual_rz: 旋转 Yaw (±180°)
  #
  # 速度限制:
  #   - 线速度: 0.1 m/s (极慢，防止甩动惯性)
  #   - 角速度: 2.0 rad/s (约 115°/s，允许适度翻转)
  # ============================================================
  flyingHand:
    enabled: False             # 默认关闭 Flying Hand（可在命令行开启）
    defaultHeight: 0.35        # 默认悬浮高度 (m)
    heightLower: 0.30          # 最低高度限制 (m)
    heightUpper: 0.40          # 最高高度限制 (m)
    xyLimit: 0.05              # XY 平面移动限制 (m)
    linearVelocity: 0.1        # 线速度限制 (m/s)
    angularVelocity: 2.0       # 角速度限制 (rad/s)
    # Flying base 的 PD 增益 (位置控制模式下)
    # 使用非常高的增益实现严格位置控制，不受外力干扰
    # 注意: 增益过高可能导致数值不稳定，需要平衡
    basePgain: 10000.0         # 位置增益 (极高以实现刚性位控)
    baseDgain: 200.0           # 速度增益 (配合高P增益的阻尼)
  asset:
    # 默认使用固定底座 URDF，禁用 Flying Hand
    # Flying 版本: 'assets/linker_hand/L25_dof_urdf_flying.urdf' (27 DoF)
    handAsset: 'assets/linker_hand/L25_dof_urdf.urdf'
  
  # ============================================================
  # 手部基座初始化位置 (Hand Base Initial Pose)
  # ============================================================
  # 这些值来自 interactive_tune.py 的输出
  # 用于非 Flying Hand 模式下设置手的 URDF Transform
  # Flying Hand 模式下这些值由虚拟关节的初始值控制
  # ============================================================
  handBaseInit:
    position: [0.0, 0.0, 0.35]    # [px, py, pz] 米
    rotation: [0.0, -1.31, 0.0]   # [rx, ry, rz] 欧拉角（弧度）
  
  # ============================================================
  # 动作空间配置 (Action Space Configuration)
  # ============================================================
  # 通过禁用无名指和小拇指来缩减动作空间，优化强化学习搜索效率
  # 
  # Linker Hand 关节顺序 (共21 DoF):
  #   little (小拇指): joint 0-3  (4 DoF)
  #   ring (无名指):   joint 4-7  (4 DoF)
  #   middle (中指):   joint 8-11 (4 DoF)
  #   index (食指):    joint 12-15 (4 DoF)
  #   thumb (拇指):    joint 16-20 (5 DoF)
  #
  # 禁用小拇指+无名指后: 21 - 8 = 13 DoF (middle + index + thumb)
  # ============================================================
  actionSpace:
    disableRingLittleFinger: True  # True: 使用13维动作空间, False: 使用21维动作空间
    # 被禁用手指的关节将锁定在初始抓取姿态
    # 观测仍包含所有手指信息（位置、触觉等）

  episodeLength: 400  # 训练时使用400, 测试时使用4000
  enableDebugVis: False
  aggregateMode: 1

  controller:
    torque_control: True
    controlFrequencyInv: 10  # 20Hz
    # PD 增益和力矩限制已调整以适配 LinkerPen (45g)
    # 原始参数 (pgain=3, dgain=0.1, torque_limit=0.7) 对应 20g 的笔
    # 第一次更改 (pgain=6, dgain=0.2, torque_limit=1.5,action_scale=0.04167) ，动作很软反应迟缓
    pgain: 15                  # 提高位置增益，增强刚性
    dgain: 0.35                # 相应提高阻尼
    action_scale: 0.1
    torque_limit: 4         # 提高力矩限制以支持更大的 PD 输出

  # ============================================================
  # 旋转轴配置 (Rotation Axis Configuration)
  # ============================================================
  # 定义期望的笔旋转轴（右手螺旋法则）
  # 
  # 支持两种格式:
  # 1. 旧格式 (字符串): '+z', '-z', '+x', '-x', '+y', '-y'
  # 2. 新格式 (三维向量): [0, 0, 1], [0, 0, -1], [1, 0, 0] 等
  #
  # 向量方向说明:
  # - 正向量: 笔绕该轴逆时针旋转得正奖励（从轴正向看）
  # - 负向量: 笔绕该轴顺时针旋转得正奖励（从轴正向看）
  #
  # 典型配置:
  # - Triangle Pass (水平桌面): [0, 0, 1] 或 [0, 0, -1]
  # - 其他转笔技巧: 根据实际旋转平面定义
  #
  # 注意: 奖励计算将笔的长轴（局部Z轴）投影到该向量的垂直平面
  # 然后计算投影向量的扫过角度，避免自转（搓笔）带来的虚假奖励
  # ============================================================
  rotation_axis: [0, 0, 1]  # 默认: 绕世界坐标系 Z 轴（正值=CCW=逆时针）
  
  genGrasps: False
  genGraspCategory: 'pencil'

  clipObservations: 5.0
  clipActions: 1.0
  # Modified - 适配 Flying Hand 的高度设置
  # Flying Hand 悬浮高度范围: 30cm~40cm
  # 早期终止阈值配置 (Early Termination Thresholds)
  relative_z_drop_threshold: 0.15  # 物体高度偏离初始位置超过此值则重置（上升或下降都算，单位:米）
  pencil_tilt_threshold: 0.08      # LinkerPen 两端高度差超过此值视为倾倒（单位:米，对应约 26° 倾斜）

  grasp_cache_name: '3_30000_49_nofly'

  # Random forces applied to the object
  forceScale: 2.0
  randomForceProbScalar: 0.25
  forceDecay: 0.9
  forceDecayInterval: 0.08
  enable_obj_ends: True # Teacher默认开启物体末端信息

  hora:
    propHistoryLen: 30
    critic_obs_dim: 100
    point_cloud_sampled_dim: 100
    render_slowness: 1

  reward:
    # ============================================================
    # 角速度奖励参数 (Angular Velocity Reward)
    # ============================================================
    # 支持两种模式:
    # 1. Clip-based (默认): r = clip(ω, angvelClipMin, angvelClipMax)
    # 2. Gaussian-kernel: r = exp(-||ω - target_angvel||² / angvel_sigma²)
    #
    # 使用 Gaussian kernel 时设置 use_gaussian_angvel_reward: True
    # ============================================================
    use_gaussian_angvel_reward: True     # 是否使用高斯核角速度奖励
    target_angvel: 3.14                   # 目标角速度 (rad/s), π rad/s ≈ 0.5 Hz
    angvel_sigma: 1.0                     # 高斯核带宽 (σ), 越小奖励越陡峭
    
    # Clip-based 参数 (use_gaussian_angvel_reward=False 时使用)
    angvelClipMin: -0.5
    angvelClipMax: 0.5
    angvelPenaltyThresHigh: 1.0
    angvelPenaltyThresLow: -0.5
    # reward scale: [init scale, final scale, curriculum start, curriculum end]
    # single scalar means no curriculum
    # 注意：这些值是合并后的最终权重（原 yaml 值 × 原 REWARD_SCALE_DICT 值）
    rotate_reward_scale: 1.0              # 旋转奖励
    obj_linvel_penalty_scale: -0.3        # 物体线速度惩罚
    torque_penalty_scale: -0.01           # 力矩惩罚
    rotate_penalty_scale: 0.0             # 旋转惩罚（逆向/超速）
    # 轴向倾斜惩罚 (Axial Tilt Penalty)
    # 惩罚物体在旋转轴方向的高度差，鼓励笔与旋转轴垂直
    axial_tilt_penalty_scale: -1.5        # 轴向倾斜惩罚权重
    axial_tilt_threshold: 0.03            # 倾斜阈值（米），低于此值不惩罚
    # canonical position
    position_penalty_scale: -0.1          # 位置惩罚
    # Flying base 移动惩罚 (仅当 flyingHand.enabled=True 时生效)
    # 惩罚 Flying base 的频繁移动，鼓励策略依赖手指技巧而非手腕运动
    # 支持 curriculum: [init scale, final scale, curriculum start, curriculum end]
    # 例如 [-0.1, -0.5, 0, 10000000] 表示从 -0.1 逐渐增加到 -0.5
    flying_base_movement_penalty_scale: -0.1  # 默认固定值，可通过命令行调整
    
    # ============================================================
    # Waypoint 跟踪奖励 (Triangle Pass)
    # ============================================================
    # 基于笔相位的指尖位置跟踪奖励
    # 使用高斯核函数: r = exp(-||q_curr - q_target||^2 / sigma)
    # 
    # 参数说明:
    # - waypoint_tracking_reward_scale: 奖励权重 (默认 0.0 禁用)
    # - waypoint_sigma: 高斯核带宽，越小奖励越"陡峭" (默认 0.05)
    # - waypoint_half_period_symmetric: 是否使用180°对称性扩展 (默认 True)
    #   - True: 笔具有对称性，只需采集 0~180° 的 waypoint
    #   - False: 物体无对称性，需采集完整 0~360° 的 waypoint
    #
    # 使用前提:
    # 1. 需要在 penspin/utils/tp_waypoints.py 中填充 TP_WAYPOINTS_RAW 数据
    # 2. 使用 cache/linker_pose/interactive_tune.py 采集 waypoint
    # 3. 至少需要 2 个 waypoint 才能启用
    #
    # 推荐值: 
    # - waypoint_tracking_reward_scale: 0.1 ~ 1.0 (根据与 rotate_reward 的相对重要性调整)
    # - waypoint_sigma: 0.05 ~ 0.1 (越小要求越精确)
    waypoint_tracking_reward_scale: 5.0       # 默认禁用，填充 waypoint 数据后启用
    waypoint_sigma: 0.05                      # 高斯核带宽
    waypoint_half_period_symmetric: True      # 笔具有180°对称性
    
    # ============================================================
    # [Anti-Hacking] EMA 平滑和惩罚参数
    # ============================================================
    # 目的: 防止策略通过高频振荡 exploit 奖励系统
    # 
    # EMA 平滑 (仅用于速度门控):
    # - ema_alpha: 平滑系数 (0.1~0.3)，越小越平滑但响应越慢
    # 
    # 惩罚参数 (基于瞬时速度):
    # - jitter_penalty_scale: 速度变化率惩罚权重 (负值)
    # - reverse_penalty_scale: 反向旋转惩罚权重 (负值)
    # ============================================================
    ema_alpha: 0.15                           # EMA 平滑系数 (仅用于速度门控)
    jitter_penalty_scale: -0.5                # Jitter 惩罚权重 (负值)
    reverse_penalty_scale: -1.0               # 反向旋转惩罚权重 (负值)
    log_scale_beta: 1.0                       # 对数缩放灵敏度控制参数
  # Modified
  baseObjScale: 1.0
  randomization:
    # ========================================================================
    # 物体物理属性随机化 (Object Physical Randomization)
    # 针对转笔技巧 (Triangle Pass, Thumb Around, Index Bust) 优化
    # ========================================================================
    
    # --- 质量随机化 ---
    # LinkerPen 质量已在 URDF 中精确定义（约 40.9g）
    # 启用微小质量扰动以增强 sim2real 鲁棒性
    randomizeMass: True
    randomizeMassLower: 0.035   # 35g (-15%)
    randomizeMassUpper: 0.048   # 48g (+17%)
    
    # --- 质心随机化 ---
    # 模拟制造公差和配重不均匀
    randomizeCOM: True
    randomizeCOMLower: -0.002   # ±2mm
    randomizeCOMUpper: 0.002
    
    # --- 摩擦系数随机化 ---
    # 真实物理参考:
    #   - 尼龙-橡胶摩擦系数: 0.3-0.6
    #   - 铝-橡胶摩擦系数: 0.4-0.8
    #   - 手指皮肤-塑料: 0.4-1.0
    # 范围设计: 适度扩展以覆盖 sim2real gap
    randomizeFriction: True
    randomizeFrictionLower: 0.4   # 最小摩擦（光滑表面）
    randomizeFrictionUpper: 1.2   # 最大摩擦（粗糙表面）
    
    # --- 恢复系数随机化 ---
    # 真实物理参考:
    #   - 塑料-橡胶碰撞: 0.2-0.5
    #   - 金属-橡胶碰撞: 0.3-0.6
    # 转笔时不希望过度弹跳，范围偏低
    randomizeRestitution: True
    randomizeRestitutionLower: 0.1   # 低弹性（能量损失大）
    randomizeRestitutionUpper: 0.5   # 中等弹性
    
    # --- 缩放随机化 ---
    # LinkerPen 使用实际尺寸，不需要缩放
    # 保留 randomizeScale=True 因为加载 dof 缓存的条件依赖它
    randomizeScale: True
    randomize_hand_scale: False
    scaleListInit: True
    randomizeScaleList: [1.0]
    randomizeScaleLower: 1.0
    randomizeScaleUpper: 1.0
    
    # --- PD 增益随机化 ---
    # 模拟电机响应差异
    randomizePDGains: True
    randomizePGainLower: 2.5
    randomizePGainUpper: 3.5
    randomizeDGainLower: 0.09
    randomizeDGainUpper: 0.11
    
    # --- 观测噪声 ---
    obs_noise_e_scale: 0.01
    obs_noise_t_scale: 0.005
    pose_noise_scale: 0
    action_noise_e_scale: 0.01
    action_noise_t_scale: 0.005
    jointNoiseScale: 0.0
    
    # --- Stage 2 特定参数 ---
    noisy_rpy_scale: 0.1
    noisy_pos_scale: 0.02
#
    # ================================================================
    # priv_info 布局说明（新版，移除 obj_scale）
    # ================================================================
    # │固定部分 (0-8):                                                  │
    # │   [0:3]   obj_position                                         │
    # │   [3:4]   obj_mass                                             │
    # │   [4:5]   obj_friction                                         │
    # │   [5:8]   obj_com                                              │
    # ├────────────────────────────────────────────────────────────────┤
    # │ 动态部分 (8+，取决于启用的项):                                     │
    # │   train_teacher.sh 默认配置 (新版):                             │
    # │   [8:12]  obj_orientation (4)                                  │
    # │   [12:15] obj_linvel (3)          ✓ 新增启用                   │
    # │   [15:18] obj_angvel (3)                                       │
    # │   [18:33] fingertip_position (15)                              │
    # │   [33:48] fingertip_linvel (15)   ✓ 新增启用                   │
    # │   [48:49] obj_restitution (1)                                  │
    # │   [49:64] tactile (15)                                         │
    # │   总维度: 64                                                    │
    # ================================================================
  privInfo:
    enableObjPos: True
    # enableObjScale: 已移除（LinkerPen 使用固定尺寸 1.0）
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True      # 固定部分到此（共8维）
    enable_obj_restitution: True
    enable_tactile: True         # Teacher默认开启触觉信息
    contact_form: 'gpu_contact'
    enable_obj_linvel: True      # Teacher默认开启物体线速度信息，3维 [新增]
    enable_obj_angvel: True      # Teacher默认开启物体角速度信息，3维
    enable_ft_pos: True          # Teacher默认开启指尖位置信息，15维
    enable_obj_orientation: True # Teacher默认开启物体姿态信息，4维
    enable_ft_orientation: False
    enable_ft_linvel: True       # Teacher默认开启指尖线速度信息，15维 [新增]
    enable_ft_angvel: False
    enable_hand_scale: False

  object:
    type: 'cylinder_linkerpen'
    evalObjectType: null
    sampleProb: [1.0]


  # 碰撞几何优化选项
  # useVHACD: True  - 使用 VHACD 凸分解，更快但精度略低
  # useVHACD: False - 使用 submesh 凸分解，更精确但较慢（默认）
  useVHACD: False

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

  # ============================================================
  # Space E 课程学习配置 (Curriculum Learning Configuration)
  # ============================================================
  # 基于动力学同构（Isomorphic Dynamics）原理的时空扭曲课程
  #
  # 核心思想：
  # - 训练初期：物理世界"变慢变软"，让 Agent 有更多反应时间
  # - 训练后期：逐渐恢复真实物理，最终在真实速度下工作
  #
  # 缩放因子 α 的物理意义：
  # - α = 0.1: 时间流逝慢 10 倍，重力只有 1% (9.81 → 0.098)
  # - α = 0.5: 时间流逝慢 2 倍，重力只有 25% (9.81 → 2.45)
  # - α = 1.0: 真实世界速度，完整重力 (9.81)
  #
  # 支持模式：
  # - 'SpaceA': Baseline，无任何缩放 (α ≡ 1.0)
  # - 'SpaceD': 仅物理缩放，无观测/奖励逆缩放（可能导致 Value 漂移）
  # - 'SpaceE': 完整动力学同构缩放（推荐）
  #
  # 注意事项：
  # 1. Isaac Gym 的 gravity 是全局参数，所有环境必须同步更新
  # 2. alpha_start 不建议低于 0.1，否则可能触发 PhysX sleep_threshold
  # 3. ratio_threshold 控制物理更新触发阈值 (5% 相对变化)
  #
  # 成功指标配置：
  # - success_rot_threshold: 成功旋转角度阈值 (rad)
  # - 自适应阈值: effective_threshold = success_rot_threshold * alpha
  # ============================================================
  curriculum:
    mode: 'SpaceA'               # 模式: 'SpaceE' (推荐), 'SpaceA' (Baseline), 'SpaceD' (仅物理缩放)
    alpha_start: 0.1             # 初始时间缩放因子 (0.1 = 10倍慢放, 重力约 1%)
    alpha_end: 1.0               # 最终时间缩放因子 (1.0 = 实时)
    curriculum_steps: 100000000  # 课程持续总步数 (约 1亿步 / 300M 总步数)
    ratio_threshold: 0.05        # 物理更新触发阈值 (5% 相对变化)
    success_rot_threshold: 10.0  # 成功旋转角度阈值 (rad), 约 1.6 圈
    use_adaptive_threshold: True # 是否使用自适应阈值 (threshold * alpha)

sim:
  dt: 0.005 # 200 Hz
  substeps: 1
  up_axis: 'z'
  use_gpu_pipeline: ${eq:${...pipeline},'gpu'}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:'cuda',${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (default - all contacts)
